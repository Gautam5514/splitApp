name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a group
        2. Tap "Add expense"
        3. ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, iOS, Web]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / commit
      placeholder: e.g. 1.0.3 or a commit SHA
  - type: input
    id: device
    attributes:
      label: Device & OS version
      placeholder: e.g. Pixel 7, Android 15
  - type: textarea
    id: logs
    attributes:
      label: Screenshots / logs
      description: Drag images here or paste relevant logs. Remove any personal data.
